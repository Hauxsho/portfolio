<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    var path = window.location.pathname;
    if (path.startsWith('/portfolio')) {
      var route = path.replace('/portfolio', '') || '/';
      window.location.replace('/portfolio/#' + route + window.location.search);
    }
  </script>
</head>
<body>
</body>
</html>
